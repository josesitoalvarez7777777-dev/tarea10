<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid 1</title>

    <style>
        #container {
            display: grid;
            width: 650px;
            height: 350px;
            margin: 70px auto;
            padding: 8px;
            border: 1px solid gray;
            gap: 8px;

            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .caja {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            color: white;
            align-content: center;
            text-align: center;
        }

        .uno {
            background-color: green;
            grid-column: 1;
            grid-row: 1 / 4;
        }

        .dos {
            background-color: green;
            grid-column: 2 / 4;
            grid-row: 1;
        }

        .tres {
            background-color: red;
            grid-column: 4;
            grid-row: 1;
        }

        .cuatro {
            background-color: green;
            grid-column: 4;
            grid-row: 2 / 4;
        }

        .cinco {
            background-color: orange;
            grid-column: 2;
            grid-row: 2;
        }

        .seis {
            background-color: orange;
            grid-column: 3;
            grid-row: 3;
        }

        .siete {
            background-color: red;
            grid-column: 3;
            grid-row: 2;
        }

        .ocho {
            background-color: red;
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>

<body>
    <h1>Grid 1</h1>

    <div id="container">
        <div class="caja uno">UNO</div>
        <div class="caja dos">DOS</div>
        <div class="caja tres">TRES</div>
        <div class="caja cuatro">CUATRO</div>
        <div class="caja cinco">CINCO</div>
        <div class="caja seis">SEIS</div>
        <div class="caja siete">SIETE</div>
        <div class="caja ocho">OCHO</div>
    </div>
</body>
</html>
